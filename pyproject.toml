[project]
name = "sentinelops"
version = "0.3.0"
description = "Evidence-first bounded incident investigation Agent with verifiable audit trail"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
sentinelops-baseline = "sentinelops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
