services:
  sentinelops:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINELOPS_API_TOKEN: "${SENTINELOPS_API_TOKEN:?set SENTINELOPS_API_TOKEN in .env}"
      SENTINELOPS_AUDIT_KEY: "${SENTINELOPS_AUDIT_KEY:?set SENTINELOPS_AUDIT_KEY in .env}"
      SENTINELOPS_DEPLOYMENT_PROFILE: "${SENTINELOPS_DEPLOYMENT_PROFILE:-development}"
      SENTINELOPS_METRICS_ENABLED: "${SENTINELOPS_METRICS_ENABLED:-0}"
      SENTINELOPS_MAX_REQUEST_BYTES: "${SENTINELOPS_MAX_REQUEST_BYTES:-1000000}"
      SENTINELOPS_RATE_LIMIT_RPM: "${SENTINELOPS_RATE_LIMIT_RPM:-60}"
      SENTINELOPS_MAX_INFLIGHT: "${SENTINELOPS_MAX_INFLIGHT:-16}"
      SENTINELOPS_TRUSTED_HOSTS: "${SENTINELOPS_TRUSTED_HOSTS:-127.0.0.1,localhost}"
      SENTINELOPS_CORS_ORIGINS: "${SENTINELOPS_CORS_ORIGINS:-}"
      SENTINELOPS_ORCHESTRATION_MODE: "${SENTINELOPS_ORCHESTRATION_MODE:-single}"
      # The reproducible container profile intentionally stays deterministic.
      SENTINELOPS_POLICY_MODE: "heuristic"
      SENTINELOPS_EVIDENCE_MODE: "${SENTINELOPS_EVIDENCE_MODE:-fixture}"
      SENTINELOPS_ALLOWED_OBSERVABILITY_HOSTS: "${SENTINELOPS_ALLOWED_OBSERVABILITY_HOSTS:-}"
      SENTINELOPS_PROMETHEUS_URL: "${SENTINELOPS_PROMETHEUS_URL:-}"
      SENTINELOPS_LOKI_URL: "${SENTINELOPS_LOKI_URL:-}"
      SENTINELOPS_TEMPO_URL: "${SENTINELOPS_TEMPO_URL:-}"
      SENTINELOPS_PROMETHEUS_TOKEN: "${SENTINELOPS_PROMETHEUS_TOKEN:-}"
      SENTINELOPS_LOKI_TOKEN: "${SENTINELOPS_LOKI_TOKEN:-}"
      SENTINELOPS_TEMPO_TOKEN: "${SENTINELOPS_TEMPO_TOKEN:-}"
      SENTINELOPS_OBSERVABILITY_TENANT: "${SENTINELOPS_OBSERVABILITY_TENANT:-}"
    volumes:
      - sentinelops-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sentinelops-data:
