services:
  sentinelops:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINELOPS_API_TOKEN: "${SENTINELOPS_API_TOKEN:?set SENTINELOPS_API_TOKEN in .env}"
      SENTINELOPS_AUDIT_KEY: "${SENTINELOPS_AUDIT_KEY:?set SENTINELOPS_AUDIT_KEY in .env}"
    volumes:
      - sentinelops-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sentinelops-data:
