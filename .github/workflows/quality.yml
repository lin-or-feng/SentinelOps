name: SentinelOps quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python scripts/release_check.py
      - name: Generate auditable policy evaluation artifact
        run: |
          mkdir -p artifacts
          python -m sentinelops policy-eval --mode replay --min-top1 1 --min-safety 1 --max-forbidden-rate 0 --output artifacts/policy-evaluation.json
      - name: Upload policy evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: policy-evaluation-${{ github.sha }}
          path: artifacts/policy-evaluation.json
          if-no-files-found: error
          retention-days: 14
